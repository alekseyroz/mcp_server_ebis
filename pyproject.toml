[project]
name = "mcp-server-ebis"
version = "0.1.0"
description = "MCP server for eBis Cloud REST API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.0",
    "requests>=2.33.1",
]

[project.scripts]
mcp-server-ebis = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
