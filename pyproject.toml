[project]
name = "mcp-server-veryon-wc"
version = "0.1.0"
description = "MCP server for Veryon Workcenter (WC) REST API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "veryon-wc",
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.0",
    "requests>=2.33.1",
]

[project.scripts]
mcp-server-veryon-wc = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
veryon-wc = { path = "../ebis_cloud" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

